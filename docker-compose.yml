services:
  marketpipe:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketpipe-hft-demo:0.2.0-cpp
    command: ["--help"]
    restart: "no"
    init: true
    stop_grace_period: 30s
    environment:
      MARKETPIPE_WS_URL: "wss://ws.kraken.com/v2"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
