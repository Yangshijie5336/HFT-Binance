services:
  marketpipe:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketpipe-hft-demo:0.3.0
    command:
      - capture
      - --symbol
      - BTCUSDT
      - --duration
      - "900"
      - --output-dir
      - /app/data/runs
    restart: "no"
    init: true
    stop_grace_period: 60s
    environment:
      MARKETPIPE_CA_FILE: /app/certs/cacert.pem
    volumes:
      - marketpipe-data:/app/data

volumes:
  marketpipe-data:
