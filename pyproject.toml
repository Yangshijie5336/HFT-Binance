[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpipe-hft-demo"
version = "0.1.0"
description = "Durable real-time public trade-feed capture, processing, factors, and signal demo"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "MarketPipe Demo Contributors"}]
dependencies = [
  "websockets>=14.2,<17",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
marketpipe = "marketpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
