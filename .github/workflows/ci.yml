name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libboost-all-dev libssl-dev ca-certificates

      - name: Configure (CMake + Ninja, Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: CTest (unit + local WebSocket integration + 100k benchmark)
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Reproducible 100,000-event benchmark
        run: |
          mkdir -p artifacts/benchmark
          ./build/marketpipe benchmark --events 100000 --mode all \
            --output-dir artifacts/benchmark | tee artifacts/benchmark/benchmark.json

      - name: Upload test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketpipe-ci-evidence
          path: |
            build/Testing/Temporary/LastTest.log
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/synthetic_benchmark_summary.json
          if-no-files-found: warn
          retention-days: 14

  docker:
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build multi-stage image
        run: docker build -t marketpipe-hft-demo:ci .

      - name: Verify non-root image starts
        run: |
          docker run --rm marketpipe-hft-demo:ci --help
          docker run --rm --entrypoint id marketpipe-hft-demo:ci
